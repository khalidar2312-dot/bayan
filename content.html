<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية بيان | محتوى المادة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBDQ0cP8C5Hv3xAun7iLSD2PSp0x7sP-08",
            authDomain: "bayan2312.firebaseapp.com",
            projectId: "bayan2312",
            storageBucket: "bayan2312.firebasestorage.app",
            messagingSenderId: "710544079379",
            appId: "1:710544079379:web:f9478de93d6005b37ddde6"
        };
        firebase.initializeApp(firebaseConfig);
        window.db = firebase.firestore();
        window.auth = firebase.auth();
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'], kufi: ['Reem Kufi', 'sans-serif'] },
                    colors: {
                        emerald: { 50: '#ecfdf5', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b', 950: '#022c22' },
                        amber: { 400: '#fbbf24', 500: '#f59e0b' }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 text-slate-800 antialiased font-sans">

    <!-- Header -->
    <header class="bg-gradient-to-l from-emerald-950 to-emerald-900 text-white shadow-xl sticky top-0 z-30 border-b border-emerald-800">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="w-9 h-9 bg-white/10 hover:bg-white/20 rounded-xl flex items-center justify-center transition" title="الرئيسية">
                    <i class="fa-solid fa-arrow-right text-sm"></i>
                </a>
                <div>
                    <h1 id="pageTitle" class="text-sm font-extrabold font-kufi">محتوى المادة</h1>
                    <p id="pageSubtitle" class="text-[11px] text-amber-300/80"></p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <div class="flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-xl">
                    <div class="w-6 h-6 rounded-full bg-emerald-700 text-amber-400 flex items-center justify-center text-xs">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <span id="headerStudentName" class="text-xs font-bold text-white">طالب</span>
                </div>
                <button onclick="goBack()" class="px-3 py-1.5 rounded-xl bg-red-500/20 hover:bg-red-500 text-red-300 hover:text-white font-bold text-xs transition border border-red-500/30">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- محتوى الصفحة -->
    <main class="max-w-6xl mx-auto px-4 py-6">

        <!-- loading -->
        <div id="loadingState" class="text-center py-20">
            <div class="w-12 h-12 border-4 border-emerald-200 border-t-emerald-700 rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-slate-400 text-sm">جاري تحميل المحتوى...</p>
        </div>

        <!-- حالة غير مصرح -->
        <div id="unauthorizedState" class="hidden text-center py-20">
            <div class="w-16 h-16 bg-red-100 text-red-500 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-xl font-bold font-kufi text-slate-800 mb-2">غير مصرح بالوصول</h2>
            <p class="text-slate-500 text-sm mb-5">ليس لديك اشتراك مفعّل في هذه المادة.</p>
            <a href="index.html" class="px-6 py-2.5 rounded-xl bg-emerald-800 text-white font-bold text-sm hover:bg-emerald-900 transition">العودة للرئيسية</a>
        </div>

        <!-- المحتوى الفعلي -->
        <div id="contentState" class="hidden">

            <!-- tabs الفيديو والملفات والاختبار -->
            <div class="flex items-center gap-3 mb-6 flex-wrap">
                <button onclick="switchTab('videos')" id="tabVideos"
                    class="px-5 py-2.5 rounded-xl font-bold text-sm transition bg-emerald-800 text-white shadow-sm">
                    <i class="fa-solid fa-play-circle ml-1"></i> الفيديوهات
                </button>
                <button onclick="switchTab('files')" id="tabFiles"
                    class="px-5 py-2.5 rounded-xl font-bold text-sm transition bg-white text-slate-600 border border-slate-200 hover:border-emerald-500">
                    <i class="fa-solid fa-file-pdf ml-1"></i> الملفات
                </button>
                <button onclick="switchTab('quiz')" id="tabQuiz"
                    class="px-5 py-2.5 rounded-xl font-bold text-sm transition bg-white text-slate-600 border border-slate-200 hover:border-emerald-500">
                    <i class="fa-solid fa-pen-to-square ml-1"></i> الاختبار
                </button>
                <span id="progressStatus" class="text-xs text-slate-400 mr-auto" aria-live="polite"></span>
            </div>

            <!-- قسم الفيديوهات -->
            <div id="videosSection">
                <div id="videosList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="text-center py-12 text-slate-400 col-span-2">
                        <i class="fa-solid fa-video-slash text-3xl mb-3 block opacity-40"></i>
                        <p class="text-sm">لا توجد فيديوهات متاحة حالياً</p>
                    </div>
                </div>
            </div>

            <!-- قسم الملفات -->
            <div id="filesSection" class="hidden">
                <div id="filesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div class="text-center py-12 text-slate-400 col-span-3">
                        <i class="fa-solid fa-folder-open text-3xl mb-3 block opacity-40"></i>
                        <p class="text-sm">لا توجد ملفات متاحة حالياً</p>
                    </div>
                </div>
            </div>

            <!-- قسم الاختبار -->
            <div id="quizSection" class="hidden">
                <!-- لو الطالب حل الاختبار قبل كده -->
                <div id="quizResult" class="hidden text-center bg-white rounded-2xl p-8 border border-slate-100 shadow-sm">
                    <div id="quizResultIcon" class="w-16 h-16 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4"></div>
                    <h3 id="quizResultTitle" class="text-xl font-extrabold font-kufi text-slate-800 mb-2"></h3>
                    <p id="quizResultScore" class="text-3xl font-black text-emerald-800 mb-1"></p>
                    <p id="quizResultPercent" class="text-sm text-slate-400 mb-6"></p>
                    <button onclick="retakeQuiz()" class="px-6 py-2.5 rounded-xl bg-emerald-800 text-white font-bold text-sm hover:bg-emerald-900 transition">
                        <i class="fa-solid fa-rotate-right ml-1"></i> إعادة الاختبار
                    </button>
                </div>

                <!-- الاختبار -->
                <div id="quizContainer">
                    <div class="text-center py-12 text-slate-400">
                        <i class="fa-solid fa-pen-to-square text-3xl mb-3 block opacity-40"></i>
                        <p class="text-sm">لا يوجد اختبار متاح حالياً</p>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- Modal مشاهدة الفيديو -->
    <div id="videoModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm hidden">
        <div class="bg-white rounded-2xl max-w-3xl w-full mx-4 overflow-hidden shadow-2xl">
            <div class="flex items-center justify-between px-4 py-3 border-b border-slate-100">
                <h3 id="videoModalTitle" class="font-bold text-slate-800 text-sm"></h3>
                <button onclick="closeVideoModal()" class="text-slate-400 hover:text-slate-600 text-xl">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-4">
                <div class="relative" style="padding-bottom: 56.25%;">
                    <iframe id="videoModalFrame" class="absolute inset-0 w-full h-full rounded-xl"
                        src="" frameborder="0" allowfullscreen
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
                    </iframe>
                </div>
            </div>
        </div>
    </div>

    <script>

        let currentStudentId = null;
        let courseVideos = [];
        let courseFiles = [];
        let completedCourseItems = new Set();
        let currentQuizQuestions = [];
        let savingCourseProgress = false;

        const courseNames = {
            'fiqh': 'الفقه الميسر',
            'tafseer': 'علم التفسير',
            'hadith': 'الحديث الشريف',
            'tawheed': 'علم التوحيد'
        };

        // جلب بارامترات الـ URL
        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('course') || '';
        const grade = urlParams.get('grade') || '';
        const term = urlParams.get('term') || '';

        // مفتاح المحتوى في Firestore
        const contentKey = `${courseId}__${grade}__${term}`.replace(/\s+/g, '_');

        document.addEventListener('DOMContentLoaded', function() {
            // تحديث العناوين
            document.getElementById('pageTitle').innerText = courseNames[courseId] || 'محتوى المادة';
            document.getElementById('pageSubtitle').innerText = grade && term ? `${grade} — ${term}` : '';

            // التحقق من الطالب
            auth.onAuthStateChanged(async function(firebaseUser) {
                if (!firebaseUser) {
                    window.location.href = 'index.html';
                    return;
                }

                document.getElementById('headerStudentName').innerText = firebaseUser.displayName || 'طالب';
                currentStudentId = firebaseUser.uid;

                try {
                    const studentDoc = await db.collection('students').doc(firebaseUser.uid).get();
                    if (!studentDoc.exists) {
                        showUnauthorized();
                        return;
                    }

                    const studentData = studentDoc.data();
                    document.getElementById('headerStudentName').innerText = studentData.fullName || 'طالب';

                    const subs = studentData.subscriptions || {};

                    // التحقق من الاشتراك
                    if (subs[courseId] !== 'approved') {
                        showUnauthorized();
                        return;
                    }

                    // تحميل المحتوى
                    showContent();
                    loadContent();

                } catch (error) {
                    console.error('خطأ:', error);
                    showUnauthorized();
                }
            });
        });

        function showUnauthorized() {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('unauthorizedState').classList.remove('hidden');
        }

        function showContent() {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('contentState').classList.remove('hidden');
        }

        async function loadContent() {
            let loadWarning = '';

            try {
                const contentDoc = await db.collection('course_content').doc(contentKey).get();
                const data = contentDoc.exists ? contentDoc.data() : {};
                courseVideos = Array.isArray(data.videos) ? data.videos : [];
                courseFiles = Array.isArray(data.files) ? data.files : [];
            } catch (error) {
                console.error('تعذر تحميل محتوى الدورة:', error);
                courseVideos = [];
                courseFiles = [];
                loadWarning = 'تعذر تحميل محتوى الدورة.';
            }

            try {
                const progressDoc = await db.collection('course_progress')
                    .doc(`${currentStudentId}__${contentKey}`).get();
                const savedItems = progressDoc.exists ? progressDoc.data().completedItems : [];
                completedCourseItems = new Set((Array.isArray(savedItems) ? savedItems : []).filter(item => {
                    if (typeof item !== 'string') return false;
                    const [type, rawIndex] = item.split(':');
                    const index = Number(rawIndex);
                    return Number.isInteger(index) && index >= 0 &&
                        ((type === 'video' && index < courseVideos.length) ||
                         (type === 'file' && index < courseFiles.length));
                }));
            } catch (error) {
                console.error('تعذر تحميل تقدم الطالب:', error);
                completedCourseItems = new Set();
                loadWarning = loadWarning
                    ? `${loadWarning} تعذر تحميل بيانات التقدم.`
                    : 'تعذر تحميل بيانات التقدم.';
            }

            renderVideos(courseVideos);
            renderFiles(courseFiles);
            updateProgressStatus(loadWarning);
            await loadQuiz();
        }

        function renderVideos(videos) {
            const container = document.getElementById('videosList');
            if (!videos.length) {
                container.innerHTML = '<div class="text-center py-12 text-slate-400 col-span-2"><i class="fa-solid fa-video-slash text-3xl mb-3 block opacity-40"></i><p class="text-sm">لا توجد فيديوهات متاحة حالياً</p></div>';
                return;
            }
            container.innerHTML = videos.map(function(v, i) {

                const isDrive = v.url && v.url.includes('drive.google.com');
                const ytId = !isDrive ? extractYoutubeId(v.url) : null;

                let thumb = 'https://placehold.co/320x180/064e3b/fbbf24?text=Video';
                if (ytId) thumb = `https://img.youtube.com/vi/${ytId}/mqdefault.jpg`;
                if (isDrive) thumb = 'https://placehold.co/320x180/064e3b/fbbf24?text=فيديو';

                return `
                    <div class="bg-white rounded-2xl overflow-hidden border border-slate-100 shadow-sm hover:shadow-md transition cursor-pointer"
                        onclick="openVideo('${v.url}', '${escapeAttr(v.title)}', ${isDrive})">
                        <div class="relative">
                            <img src="${thumb}" alt="${escapeAttr(v.title)}" class="w-full h-44 object-cover">
                            <div class="absolute inset-0 bg-slate-950/30 flex items-center justify-center">
                                <div class="w-12 h-12 bg-white/90 rounded-full flex items-center justify-center shadow-lg">
                                    <i class="fa-solid fa-play text-emerald-800 mr-0.5"></i>
                                </div>
                            </div>
                            ${v.duration ? `<span class="absolute top-2 right-2 bg-slate-900/70 text-white text-[10px] font-bold px-2 py-0.5 rounded-lg">${v.duration}</span>` : ''}
                        </div>
                        <div class="p-3">
                            <h3 class="font-bold text-slate-800 text-sm">${escapeHtml(v.title)}</h3>
                            ${v.description ? `<p class="text-xs text-slate-400 mt-1">${escapeHtml(v.description)}</p>` : ''}
                            <button type="button" onclick="event.stopPropagation(); toggleCourseItem('video', ${i})" class="mt-3 px-3 py-1.5 rounded-lg ${completedCourseItems.has(`video:${i}`) ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'} text-xs font-bold hover:bg-emerald-100 hover:text-emerald-700 transition">
                                <i class="fa-solid ${completedCourseItems.has(`video:${i}`) ? 'fa-circle-check' : 'fa-circle'} ml-1"></i>
                                ${completedCourseItems.has(`video:${i}`) ? 'مكتمل' : 'تحديد كمكتمل'}
                            </button>
                        </div>
                    </div>`;
            }).join('');
        }

        function renderFiles(files) {
            const container = document.getElementById('filesList');
            if (!files.length) {
                container.innerHTML = '<div class="text-center py-12 text-slate-400 col-span-3"><i class="fa-solid fa-folder-open text-3xl mb-3 block opacity-40"></i><p class="text-sm">لا توجد ملفات متاحة حالياً</p></div>';
                return;
            }
            container.innerHTML = files.map(function(f, i) {
                const isDrive = f.url && f.url.includes('drive.google.com');

                if (isDrive) {
                    // عرض PDF في iframe
                    return `
                        <div class="bg-white rounded-2xl overflow-hidden border border-slate-100 shadow-sm col-span-1 md:col-span-2 lg:col-span-3">
                            <div class="flex items-center justify-between px-4 py-3 border-b border-slate-100">
                                <div class="flex items-center gap-2">
                                    <i class="fa-solid fa-file-pdf text-red-500 text-lg"></i>
                                    <span class="font-bold text-slate-800 text-sm">${escapeHtml(f.title)}</span>
                                </div>
                                <a href="${escapeHtml(f.url.replace('/preview', '/view'))}" target="_blank" rel="noopener noreferrer"
                                    class="px-3 py-1.5 rounded-xl bg-emerald-700 text-white text-xs font-bold hover:bg-emerald-800 transition">
                                    <i class="fa-solid fa-external-link-alt ml-1"></i> فتح في تبويب جديد
                                </a>
                                <button type="button" onclick="toggleCourseItem('file', ${i})" class="px-3 py-1.5 rounded-xl ${completedCourseItems.has(`file:${i}`) ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'} text-xs font-bold">
                                    ${completedCourseItems.has(`file:${i}`) ? 'مكتمل' : 'تحديد كمكتمل'}
                                </button>
                            </div>
                            <iframe src="${escapeHtml(f.url)}" class="w-full" style="height: 500px;" frameborder="0" allowfullscreen></iframe>
                        </div>`;
                } else {
                    return `
                        <div class="bg-white rounded-2xl p-4 border border-slate-100 shadow-sm hover:shadow-md hover:border-emerald-300 transition">
                            <a href="${escapeHtml(f.url)}" target="_blank" rel="noopener noreferrer" class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-slate-50 rounded-xl flex items-center justify-center text-xl flex-shrink-0">
                                    <i class="fa-solid fa-file text-slate-500"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="font-bold text-slate-800 text-sm truncate">${escapeHtml(f.title)}</p>
                                    <p class="text-[11px] text-slate-400 mt-0.5">اضغط للفتح</p>
                                </div>
                                <i class="fa-solid fa-external-link-alt text-emerald-700 text-sm flex-shrink-0"></i>
                            </a>
                            <button type="button" onclick="toggleCourseItem('file', ${i})" class="mt-3 px-3 py-1.5 rounded-lg ${completedCourseItems.has(`file:${i}`) ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'} text-xs font-bold hover:bg-emerald-100 hover:text-emerald-700 transition">
                                <i class="fa-solid ${completedCourseItems.has(`file:${i}`) ? 'fa-circle-check' : 'fa-circle'} ml-1"></i>
                                ${completedCourseItems.has(`file:${i}`) ? 'مكتمل' : 'تحديد كمكتمل'}
                            </button>
                        </div>`;
                }
            }).join('');
        }

        async function toggleCourseItem(type, index) {
            if (!currentStudentId || savingCourseProgress) return;
            const itemId = `${type}:${index}`;
            if ((type === 'video' && index >= courseVideos.length) ||
                (type === 'file' && index >= courseFiles.length)) return;

            savingCourseProgress = true;
            const wasCompleted = completedCourseItems.has(itemId);
            if (wasCompleted) completedCourseItems.delete(itemId);
            else completedCourseItems.add(itemId);

            renderVideos(courseVideos);
            renderFiles(courseFiles);
            updateProgressStatus('جارٍ حفظ تقدمك...');

            try {
                await db.collection('course_progress').doc(`${currentStudentId}__${contentKey}`).set({
                    studentId: currentStudentId,
                    courseId: courseId,
                    grade: grade,
                    term: term,
                    completedItems: Array.from(completedCourseItems),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
                updateProgressStatus();
            } catch (error) {
                console.error('تعذر حفظ تقدم الطالب:', error);
                if (wasCompleted) completedCourseItems.add(itemId);
                else completedCourseItems.delete(itemId);
                renderVideos(courseVideos);
                renderFiles(courseFiles);
                updateProgressStatus('تعذر حفظ تقدمك. تحقق من الاتصال ثم أعد المحاولة.');
            } finally {
                savingCourseProgress = false;
            }
        }

        function updateProgressStatus(message) {
            const total = courseVideos.length + courseFiles.length;
            const completed = completedCourseItems.size;
            const status = document.getElementById('progressStatus');
            status.innerText = message || (total
                ? `إكمال المحتوى: ${completed} من ${total}`
                : 'لا يوجد محتوى لقياس التقدم بعد');
            status.classList.toggle('text-red-500', Boolean(message && message.startsWith('تعذر')));
        }

        async function loadQuiz() {
            const container = document.getElementById('quizContainer');
            const result = document.getElementById('quizResult');
            container.innerHTML = '<div class="text-center py-12 text-slate-400">جاري تحميل الاختبار...</div>';
            result.classList.add('hidden');
            container.classList.remove('hidden');

            let quizDoc;
            try {
                quizDoc = await db.collection('quizzes').doc(contentKey).get();
            } catch (error) {
                console.error('تعذر قراءة أسئلة الاختبار من quizzes:', error);
                container.innerHTML = `<div class="text-center py-8 text-red-500">تعذر تحميل أسئلة الاختبار (${escapeHtml(error.code || 'خطأ غير معروف')}). تحقق من صلاحية قراءة مجموعة quizzes في Firestore.</div>`;
                return;
            }

            currentQuizQuestions = quizDoc.exists() && Array.isArray(quizDoc.data().questions)
                ? quizDoc.data().questions
                : [];
            if (!currentQuizQuestions.length) {
                container.innerHTML = '<div class="text-center py-12 text-slate-400"><i class="fa-solid fa-pen-to-square text-3xl mb-3 block opacity-40"></i><p class="text-sm">لا يوجد اختبار متاح حالياً لهذه المادة والصف والفصل الدراسي</p></div>';
                return;
            }

            try {
                const resultDoc = await db.collection('quiz_results').doc(`${currentStudentId}__${contentKey}`).get();
                if (resultDoc.exists()) {
                    const savedResult = resultDoc.data();
                    showQuizResult(savedResult.score, savedResult.total, savedResult.submittedAt);
                    return;
                }
                renderQuizQuestions();
            } catch (error) {
                console.error('تعذر قراءة نتيجة الاختبار من quiz_results:', error);
                renderQuizQuestions(`تعذر التحقق من وجود نتيجة سابقة (${escapeHtml(error.code || 'خطأ غير معروف')}). سيظهر الاختبار، لكن قد تحتاج صلاحيات Firestore إلى مراجعة قبل حفظ النتيجة.`);
            }
        }

        function renderQuizQuestions(warningMessage = '') {
            const letters = ['أ', 'ب', 'ج', 'د'];
            document.getElementById('quizContainer').innerHTML = `
                <form onsubmit="submitQuiz(event)" class="space-y-4">
                    ${warningMessage ? `<p class="rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">${warningMessage}</p>` : ''}
                    ${currentQuizQuestions.map((question, index) => `
                        <fieldset class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm">
                            <legend class="font-bold text-slate-800 text-sm mb-3">${index + 1}. ${escapeHtml(question.question)}</legend>
                            <div class="space-y-2">
                                ${(Array.isArray(question.options) ? question.options : []).map((option, optionIndex) => `
                                    <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-100 hover:bg-emerald-50 cursor-pointer">
                                        <input type="radio" name="answer-${index}" value="${optionIndex}" required class="text-emerald-700">
                                        <span class="text-sm text-slate-700">${letters[optionIndex] || ''}. ${escapeHtml(option)}</span>
                                    </label>`).join('')}
                            </div>
                        </fieldset>`).join('')}
                    <p id="quizSubmitMessage" class="text-sm text-red-500" aria-live="polite"></p>
                    <button type="submit" class="px-6 py-3 rounded-xl bg-emerald-800 text-white font-bold text-sm hover:bg-emerald-900 transition">
                        <i class="fa-solid fa-paper-plane ml-1"></i> إرسال الإجابات
                    </button>
                </form>`;
        }

        async function submitQuiz(event) {
            event.preventDefault();
            const form = event.currentTarget;
            if (!form.reportValidity()) return;

            const answers = currentQuizQuestions.map((_, index) =>
                Number(form.querySelector(`input[name="answer-${index}"]:checked`).value)
            );
            const score = currentQuizQuestions.reduce((sum, question, index) =>
                sum + (Number(question.correct) === answers[index] ? 1 : 0), 0);
            const total = currentQuizQuestions.length;

            try {
                await db.collection('quiz_results').doc(`${currentStudentId}__${contentKey}`).set({
                    studentId: currentStudentId,
                    courseId: courseId,
                    grade: grade,
                    term: term,
                    score: score,
                    total: total,
                    submittedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                showQuizResult(score, total);
            } catch (error) {
                console.error('تعذر حفظ نتيجة الاختبار:', error);
                document.getElementById('quizSubmitMessage').innerText = 'تعذر حفظ النتيجة. تحقق من الاتصال ثم أعد الإرسال.';
            }
        }

        function showQuizResult(score, total, submittedAt) {
            const percentage = total > 0 ? Math.round((Number(score) / Number(total)) * 100) : 0;
            document.getElementById('quizResultIcon').className = `w-16 h-16 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4 ${percentage >= 50 ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-600'}`;
            document.getElementById('quizResultIcon').innerHTML = `<i class="fa-solid ${percentage >= 50 ? 'fa-trophy' : 'fa-book-open'}"></i>`;
            document.getElementById('quizResultTitle').innerText = percentage >= 85
                ? 'ممتاز! أحسنت'
                : percentage >= 50 ? 'أحسنت، واصل التقدم' : 'حاول مرة أخرى وراجع المحتوى';
            document.getElementById('quizResultScore').innerText = `${score} / ${total}`;
            document.getElementById('quizResultPercent').innerText = `درجتك ${percentage}%${submittedAt ? ` — آخر محاولة: ${formatQuizDate(submittedAt)}` : ''}`;
            document.getElementById('quizResult').classList.remove('hidden');
            document.getElementById('quizContainer').classList.add('hidden');
        }

        function formatQuizDate(value) {
            const date = typeof value.toDate === 'function' ? value.toDate() : new Date(value);
            return Number.isNaN(date.getTime()) ? '' : date.toLocaleDateString('ar-EG');
        }

        function retakeQuiz() {
            document.getElementById('quizResult').classList.add('hidden');
            document.getElementById('quizContainer').classList.remove('hidden');
            renderQuizQuestions();
        }

        function switchTab(tab) {
            const tabs = {
                videos: ['videosSection', 'tabVideos'],
                files: ['filesSection', 'tabFiles'],
                quiz: ['quizSection', 'tabQuiz']
            };
            Object.entries(tabs).forEach(([name, [sectionId, buttonId]]) => {
                const active = name === tab;
                document.getElementById(sectionId).classList.toggle('hidden', !active);
                document.getElementById(buttonId).className = active
                    ? 'px-5 py-2.5 rounded-xl font-bold text-sm transition bg-emerald-800 text-white shadow-sm'
                    : 'px-5 py-2.5 rounded-xl font-bold text-sm transition bg-white text-slate-600 border border-slate-200 hover:border-emerald-500';
            });
        }

        function openVideo(url, title, isDrive) {
            let embedUrl;

            if (isDrive) {
                // Drive video — استخدم preview
                const fileMatch = url.match(/drive\.google\.com\/file\/d\/([^\/\?]+)/);
                embedUrl = fileMatch
                    ? `https://drive.google.com/file/d/${fileMatch[1]}/preview`
                    : url;
            } else {
                // يوتيوب
                const ytId = extractYoutubeId(url);
                embedUrl = ytId
                    ? `https://www.youtube.com/embed/${ytId}?autoplay=1`
                    : url;
            }

            document.getElementById('videoModalTitle').innerText = title;
            document.getElementById('videoModalFrame').src = embedUrl;
            document.getElementById('videoModal').classList.remove('hidden');
        }

        function closeVideoModal() {
            document.getElementById('videoModalFrame').src = '';
            document.getElementById('videoModal').classList.add('hidden');
        }

        function extractYoutubeId(url) {
            if (!url) return null;
            const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\n?#]+)/);
            return match ? match[1] : null;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text == null ? '' : String(text);
            return div.innerHTML;
        }

        function escapeAttr(text) {
            return (text || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        function goBack() {
            window.location.href = 'index.html';
        }

    </script>

</body>
</html>
